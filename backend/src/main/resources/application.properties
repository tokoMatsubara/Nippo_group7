spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/dailymanagement_db
spring.datasource.username=general_user
spring.datasource.password=pass123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.openai.base-url=http://127.0.0.1:1234
spring.ai.openai.api-key=dummy
spring.ai.openai.chat.options.model=google/gemma-4-e4b
spring.ai.openai.chat.options.temperature=1.5

spring.http.client.factory=simple

jwt.secret=${JWT_SECRET:change-me-to-a-very-long-random-secret-key-256bit}
jwt.expiration-ms=900000